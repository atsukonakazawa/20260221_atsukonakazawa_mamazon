version: '3.8'

services:
  nginx:
    image: nginx:1.21.1
    # 参照するimage名を指定。ここではDockerHubの公式イメージを指定している。
    ports:
      - "80:80"
      # ホストとゲストのポート番号のマッピング。
    volumes:
      - ./back/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      #設定ファイル（default.conf）をコンテナ内の/etc/nginx/conf.d/にマウント。
      - ./back/src:/var/www/
      #srcディレクトリをコンテナ内の/var/www/にマウント
    depends_on:
      - php
      # サービス同士の依存関係。php から起動されてから、 nginx のサービスが起動する設定

  php:
  #　Dockerfileを作成しているので、ここではimageは設定しない。
    build: ./back/docker/php
    # ./back/docker/phpディレクトリにあるDockerfileをビルドする設定
    volumes:
      - ./back/src:/var/www/
      # srcディレクトリをコンテナ内の/var/www/にマウント

  mysql:
    image: mysql:8.0.26
    platform: linux/x86_64
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: laravel_db
      MYSQL_USER: laravel_user
      MYSQL_PASSWORD: laravel_pass
    command: mysqld --default-authentication-plugin=mysql_native_password
    volumes:
      - ./back/docker/mysql/data:/var/lib/mysql
      - ./back/docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    platform: linux/x86_64
    environment:
      - PMA_ARBITRARY=1
      - PMA_HOST=mysql
      - PMA_USER=laravel_user
      - PMA_PASSWORD=laravel_pass
    depends_on:
      - mysql
    ports:
      - 8080:80

  frontend:
    build:
      context: ./front
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./front:/app:cached
      - /app/node_modules
    environment:
      - NODE_ENV=development
    command: npm run dev
    platform: linux/amd64

